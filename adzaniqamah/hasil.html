<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Kuis - PAI Kelas 3</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        :root { --color-blue: #0d6efd; --color-yellow: #ffc107; --color-green: #198754; --border-tegas: 3px solid #000; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8f9fa; color: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        h1, h2, h3, h4, h5, .font-ubuntu { font-family: 'Ubuntu', sans-serif; font-weight: 700; }
        .box-tegas { border: var(--border-tegas); border-radius: 0; box-shadow: 6px 6px 0px #000; background-color: #fff; width: 100%; max-width: 500px; padding: 0; overflow: hidden; }
        .header-blue { background-color: var(--color-blue); color: #fff; border-bottom: var(--border-tegas); padding: 20px; text-align: center; }
        .btn-tegas { border: var(--border-tegas); border-radius: 0; font-weight: 700; text-transform: uppercase; box-shadow: 4px 4px 0px #000; transition: all 0.1s ease; text-decoration: none; cursor: pointer; display: block; text-align: center; }
        .btn-tegas:active { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #000; }
        .btn-yellow { background-color: var(--color-yellow); color: #000; }
        .btn-yellow:hover { color: #000; }
        .btn-green { background-color: var(--color-green); color: #fff; }
        .btn-green:hover { color: #fff; }
        .nilai-besar { font-size: 5rem; font-family: 'Ubuntu'; font-weight: bold; color: var(--color-blue); text-shadow: 2px 2px 0px #000; }
    </style>
</head>
<body>
    <div class="box-tegas m-3">
        <div class="header-blue">
            <h3 class="mb-0 font-ubuntu">HASIL BELAJAR</h3>
        </div>
        <div class="p-4 text-center">
            <h5 class="fw-bold mb-1" id="tampilNama">Nama Siswa</h5>
            <p class="text-muted mb-4" id="tampilKelas">Kelas</p>
            
            <p class="mb-0 fw-bold">Nilai Kamu:</p>
            <div class="nilai-besar my-2" id="tampilNilai">0</div>
            <p class="mb-4">Benar <span id="tampilBenar">0</span> dari <span id="tampilTotal">0</span> Soal</p>
            
            <a href="#" id="btnKirimWA" class="btn btn-tegas btn-green py-3 mb-3">
                <i class="fa-brands fa-whatsapp fa-xl me-2"></i> Kirim Nilai ke WA Pak Arif
            </a>
            
            <button onclick="kerjakanLagi()" class="btn btn-tegas btn-yellow py-3 w-100">
                <i class="fa-solid fa-rotate-right me-2"></i> Mengerjakan Lagi
            </button>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const nama = localStorage.getItem('namaSiswa') || '-';
            const kelas = localStorage.getItem('kelasSiswa') || '-';
            const nilai = localStorage.getItem('nilaiAkhir') || '0';
            const benar = localStorage.getItem('jumlahBenar') || '0';
            const total = localStorage.getItem('totalSoal') || '0';

            document.getElementById('tampilNama').innerText = nama;
            document.getElementById('tampilKelas').innerText = "Kelas: " + kelas;
            document.getElementById('tampilNilai').innerText = nilai;
            document.getElementById('tampilBenar').innerText = benar;
            document.getElementById('tampilTotal').innerText = total;

            // Buat Link WA Hidden
            const noWA = "6285161338173";
            const pesan = `Assalamualaikum Pak Arif, saya ${nama} dari kelas ${kelas} telah mengerjakan soal PAI Azan dan Iqamah dengan hasil nilai ${nilai}.`;
            const waLink = `https://wa.me/${noWA}?text=${encodeURIComponent(pesan)}`;
            
            document.getElementById('btnKirimWA').href = waLink;
        });

        function kerjakanLagi() {
            localStorage.clear();
            window.location.href = 'soal.html';
        }
    </script>
</body>
</html>

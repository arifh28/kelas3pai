<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>20 Sifat Mustahil Allah Swt.</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; color: #334155; }
        .mobile-wrapper {
            max-width: 480px; margin: 0 auto; background-color: #ffffff;
            min-height: 100vh; box-shadow: 0 0 20px rgba(0,0,0,0.05);
            overflow-x: hidden; position: relative; padding-bottom: 80px;
        }
        .hero-section {
            background: linear-gradient(135deg, #7f1d1d 0%, #b91c1c 100%);
            color: white; padding: 2.5rem 1.5rem 3.5rem 1.5rem;
            border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; text-align: center;
        }
        .sifat-card {
            border: 1px solid #fee2e2; border-radius: 16px; background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02); margin-top: -1.5rem; margin-bottom: 1rem; padding: 1.25rem;
        }
        .sifat-card:not(:first-child) { margin-top: 0; }
        .card-number {
            background-color: #fef2f2; color: #b91c1c; width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; font-weight: 700; flex-shrink: 0;
        }
        .sifat-title { font-weight: 700; color: #1e293b; font-size: 1.15rem; margin-bottom: 0; }
        .sifat-meaning { font-weight: 600; color: #b91c1c; font-size: 0.85rem; }
        .arabic-text {
            font-family: 'Amiri', serif; font-size: 1.75rem; color: #7f1d1d;
            text-align: right; direction: rtl; font-weight: bold; border-bottom: 1px dashed #f87171;
            padding-bottom: 0.5rem; margin-bottom: 0.75rem;
        }
        .sifat-desc { font-size: 0.9rem; color: #64748b; line-height: 1.5; margin-bottom: 0; }
        
        /* Action Bar */
        .action-bar {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; background: #ffffff;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.08); padding: 1rem;
            display: flex; gap: 1rem; z-index: 100; border-top-left-radius: 20px; border-top-right-radius: 20px;
        }
        .btn-action {
            flex: 1; padding: 0.75rem; font-weight: 700; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; gap: 0.25rem; text-decoration: none;
        }
        .btn-quiz { background-color: #fef2f2; color: #b91c1c; border: 1px solid #b91c1c; }
        .btn-game { background-color: #fff3cd; color: #856404; border: 1px solid #ffc107; }
    </style>
</head>
<body>
    <div class="mobile-wrapper">
        <header class="hero-section">
            <h1 class="h4 fw-bold mb-2"><i class="fas fa-ban me-2"></i>Sifat Mustahil Allah</h1>
            <p class="small opacity-75 mb-0">Sifat yang tidak mungkin dan mustahil dimiliki oleh Allah Swt.</p>
        </header>

        <main class="px-3 pb-4">
            <div id="materi-container"></div>
        </main>
        
        <div class="action-bar">
            <a href="ujisifatmustahilallah.html" class="btn-action btn-quiz">
                <i class="fas fa-edit"></i><span>Uji Kuis</span>
            </a>
            <a href="cocoksifatmustahilallah.html" class="btn-action btn-game">
                <i class="fas fa-link"></i><span>Tarik Benang</span>
            </a>
        </div>
    </div>

    <script>
        const data = [
            { term: "‘Adamun", arabic: "عَدَمٌ", meaning: "Tidak ada", desc: "Allah Swt. tidak mungkin memiliki sifat tidak ada. Allah Swt. selalu ada untuk makhluk dan semesta alam." },
            { term: "Ḥudūṡ", arabic: "حُدُوثٌ", meaning: "Baru / ada yang mendahului", desc: "Allah Swt. mustahil didahului oleh makhluk. Allah Swt. lebih dahulu ada daripada terwujudnya alam semesta." },
            { term: "Fanā’", arabic: "فَنَاءٌ", meaning: "Binasa", desc: "Allah Swt. mustahil binasa atau tidak kekal. Makhluk akan mati, sedangkan Allah Maha Kekal Abadi." },
            { term: "Mumāṡalatu lil ḥawādiṡ", arabic: "مُمَاثَلَةٌ لِلْحَوَادِثِ", meaning: "Menyerupai makhluk", desc: "Allah Swt. mustahil diserupai oleh makhluk. Tidak ada satupun yang menyerupai Allah Swt." },
            { term: "Qiyāmuhu bigairihi", arabic: "قِيَامُهُ بِغَيْرِهِ", meaning: "Bergantung dengan makhluk", desc: "Allah Swt. tidak butuh bantuan siapa pun dalam mengatur segala sesuatu di alam semesta." },
            { term: "Ta’addud", arabic: "تَعَدُّدٌ", meaning: "Lebih dari satu", desc: "Allah Swt. mustahil berjumlah banyak. Allah Swt. hanya satu dan tidak berbilang." },
            { term: "’Ajzun", arabic: "عَجْزٌ", meaning: "Lemah", desc: "Allah Swt. mustahil memiliki sifat lemah. Allah Swt. Maha Berkuasa terhadap alam semesta." },
            { term: "Karāhah", arabic: "كَرَاهَةٌ", meaning: "Terpaksa dalam berkehendak", desc: "Allah Swt. mustahil terpaksa. Segala sesuatu berjalan atas kehendak-Nya semata." },
            { term: "Jahlun", arabic: "جَهْلٌ", meaning: "Bodoh", desc: "Allah Swt. mustahil memiliki sifat bodoh dalam menentukan ketetapan makhluk." },
            { term: "Mautun", arabic: "مَوْتٌ", meaning: "Mati", desc: "Allah Swt. mustahil mati. Sifat mati hanya berlaku untuk makhluk." },
            { term: "Ṣummun", arabic: "صُمٌّ", meaning: "Tuli", desc: "Allah Swt. mustahil tuli. Allah Swt. Maha Mendengar baik suara lirih maupun lantang." },
            { term: "Umyun", arabic: "عُمْيٌ", meaning: "Buta", desc: "Allah Swt. mustahil buta. Tidak ada gerak-gerik makhluk yang luput dari pengawasan-Nya." },
            { term: "Bukmun", arabic: "بُكْمٌ", meaning: "Bisu", desc: "Allah Swt. mustahil bisu. Allah Swt. berfirman sesuai kehendak-Nya (melalui Al-Qur’an)." },
            { term: "Ājizun", arabic: "عَاجِزًا", meaning: "Dalam keadaan lemah", desc: "Allah Swt. mustahil lemah. Allah Maha Perkasa atas segala sesuatu di alam." },
            { term: "Kārihan", arabic: "كَارِهًا", meaning: "Terpaksa", desc: "Allah Swt. mustahil memutuskan sesuatu karena terpaksa. Semua murni atas kehendak-Nya." },
            { term: "Jāhilan", arabic: "جَاهِلًا", meaning: "Bodoh", desc: "Allah Swt. mustahil bodoh. Allah Swt. Maha Mengetahui segala sesuatu." },
            { term: "Mayyitan", arabic: "مَيِّتًا", meaning: "Dalam keadaan mati", desc: "Allah Swt. mustahil mati. Allah Swt. Mahahidup dan Kekal." },
            { term: "Asamma", arabic: "أَصَمَّ", meaning: "Dalam keadaan tuli", desc: "Allah Swt. mustahil tuli. Ia Maha Mendengar perkataan terang maupun tersembunyi." },
            { term: "A‘mā", arabic: "أَعْمَى", meaning: "Buta", desc: "Allah Swt. mustahil buta. Semua hal tidak ada yang dapat bersembunyi dari-Nya." },
            { term: "Abkam", arabic: "أَبْكَمَ", meaning: "Bisu", desc: "Allah Swt. mustahil bisu. Buktinya Allah berfirman dalam Al-Qur’an." }
        ];

        const container = document.getElementById('materi-container');
        data.forEach((item, index) => {
            container.innerHTML += `
                <div class="sifat-card">
                    <div class="d-flex align-items-center mb-3 gap-3">
                        <div class="card-number">${index + 1}</div>
                        <div>
                            <h3 class="sifat-title">${item.term}</h3>
                            <p class="sifat-meaning">${item.meaning}</p>
                        </div>
                    </div>
                    <div class="arabic-text">${item.arabic}</div>
                    <p class="sifat-desc">${item.desc}</p>
                </div>
            `;
        });
    </script>
</body>
</html>

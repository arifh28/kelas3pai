<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Latihan Soal ASAS PAIBP Kelas 3</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Google Fonts: Plus Jakarta Sans & Amiri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@400;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --sky-primary: #0ea5e9;
            --sky-dark: #0284c7;
            --sky-light: #e0f2fe;
            --sky-soft: #f0f9ff;
            --sun-yellow: #facc15;
            --sun-amber: #eab308;
            --sun-light: #fef9c3;
            --sun-soft: #fefce8;
            --text-dark: #0f172a;
            --text-muted: #475569;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f4f9fd;
            color: var(--text-dark);
            line-height: 1.6;
        }

        .arabic {
            font-family: 'Amiri', serif;
            font-size: 1.4rem;
            direction: rtl;
            line-height: 2;
        }

        /* Hero Banner */
        .hero-result {
            background: linear-gradient(135deg, #0284c7 0%, #38bdf8 100%);
            color: #ffffff;
            border-radius: 0 0 26px 26px;
            padding: 2rem 1rem 3rem;
            box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.25);
        }

        .score-card {
            background: #ffffff;
            border-radius: 20px;
            border: 2px solid var(--sky-light);
            box-shadow: 0 12px 28px -6px rgba(15, 23, 42, 0.1);
            margin-top: -2rem;
            padding: 1.5rem;
        }

        .score-circle {
            width: 112px;
            height: 112px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--sun-yellow) 0%, #fde047 100%);
            color: #422006;
            border: 4px solid #ffffff;
            box-shadow: 0 6px 18px rgba(234, 179, 8, 0.35);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }

        .stat-box {
            background-color: var(--sky-soft);
            border: 1.5px solid #bae6fd;
            border-radius: 18px;
            padding: 0.85rem;
            text-align: center;
            height: 100%;
        }

        .stat-box-yellow {
            background-color: var(--sun-soft);
            border: 1.5px solid #fde047;
            border-radius: 18px;
            padding: 0.85rem;
            text-align: center;
            height: 100%;
        }

        /* Filter Buttons */
        .btn-filter {
            border-radius: 18px;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
            border: 1.5px solid #bae6fd;
            background-color: #ffffff;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        .btn-filter.active {
            background-color: var(--sky-primary);
            border-color: var(--sky-primary);
            color: #ffffff;
        }

        .btn-yellow {
            background-color: var(--sun-yellow);
            color: #422006;
            font-weight: 800;
            border-radius: 18px;
            padding: 0.7rem 1.35rem;
            border: none;
            box-shadow: 0 4px 12px rgba(250, 204, 21, 0.35);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-yellow:hover {
            background-color: var(--sun-amber);
            color: #422006;
        }

        .btn-sky {
            background-color: var(--sky-primary);
            color: #ffffff;
            font-weight: 700;
            border-radius: 18px;
            padding: 0.7rem 1.35rem;
            border: none;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-sky:hover {
            background-color: var(--sky-dark);
            color: #ffffff;
        }

        /* Review Item Card */
        .review-card {
            background: #ffffff;
            border-radius: 20px;
            border: 2px solid #e2e8f0;
            padding: 1.25rem;
            margin-bottom: 1rem;
            box-shadow: 0 4px 14px -4px rgba(15, 23, 42, 0.06);
        }

        .review-card.is-correct {
            border-color: #86efac;
        }

        .review-card.is-wrong {
            border-color: #fca5a5;
        }

        .stimulus-mini {
            background-color: #f8fafc;
            border-left: 4px solid #94a3b8;
            border-radius: 14px;
            padding: 0.75rem 1rem;
            font-size: 0.9rem;
            margin-bottom: 0.75rem;
        }

        .ans-pill-correct {
            background-color: #dcfce7;
            border: 1.5px solid #4ade80;
            color: #14532d;
            border-radius: 18px;
            padding: 0.65rem 1rem;
            font-weight: 600;
        }

        .ans-pill-wrong {
            background-color: #fee2e2;
            border: 1.5px solid #f87171;
            color: #7f1d1d;
            border-radius: 18px;
            padding: 0.65rem 1rem;
            font-weight: 600;
        }

        .pembahasan-box {
            background-color: var(--sky-soft);
            border: 1.5px solid #bae6fd;
            border-radius: 18px;
            padding: 0.8rem 1rem;
            font-size: 0.88rem;
            color: #0c4a6e;
            margin-top: 0.75rem;
        }
    </style>
</head>
<body>

    <!-- Hero Header -->
    <header class="hero-result text-center">
        <div class="container">
            <span class="badge bg-warning text-dark rounded-pill px-3 py-2 fw-bold mb-2">
                <i class="fa-solid fa-award me-1"></i> Hasil Latihan ASAS PAIBP
            </span>
            <h1 class="h4 fw-extrabold mb-1" style="font-weight: 800;" id="studentTitle">Hasil Pengerjaan Siswa</h1>
            <p class="small opacity-90 mb-0" id="studentSubtitle">Kelas - &bull; Waktu Selesai</p>
        </div>
    </header>

    <main class="container mb-5">
        <!-- Ringkasan Skor -->
        <section class="score-card mb-4">
            <div class="row g-3 align-items-center">
                <div class="col-12 col-md-4 text-center">
                    <div class="score-circle">
                        <span class="small fw-bold text-uppercase" style="font-size: 0.7rem;">Nilai Akhir</span>
                        <span class="fw-extrabold" style="font-size: 2rem; line-height: 1.1;" id="finalScore">0</span>
                    </div>
                    <div class="mt-2 fw-bold text-primary small" id="predikatText">Predikat: -</div>
                </div>

                <div class="col-12 col-md-8">
                    <div class="row g-2">
                        <div class="col-4">
                            <div class="stat-box">
                                <div class="small text-muted fw-semibold">Pilihan Ganda</div>
                                <div class="h5 fw-bold text-primary mb-0" id="pgStat">0 / 40</div>
                                <div class="small text-muted" style="font-size: 0.75rem;">Benar</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="stat-box-yellow">
                                <div class="small text-muted fw-semibold">Isian Singkat</div>
                                <div class="h5 fw-bold text-warning-emphasis mb-0" id="isianStat">0 / 10</div>
                                <div class="small text-muted" style="font-size: 0.75rem;">Benar</div>
                            </div>
                        </div>
                        <div class="col-4">
                            <div class="stat-box">
                                <div class="small text-muted fw-semibold">Total Benar</div>
                                <div class="h5 fw-bold text-success mb-0" id="totalStat">0 / 50</div>
                                <div class="small text-muted" style="font-size: 0.75rem;">Soal</div>
                            </div>
                        </div>
                    </div>

                    <div id="syncBadgeWrapper" class="mt-3 text-center text-md-start small"></div>

                    <div class="d-flex flex-wrap gap-2 mt-3">
                        <a href="index.html" class="btn-sky flex-grow-1 flex-md-grow-0">
                            <i class="fa-solid fa-book-open"></i> Kembali ke Materi
                        </a>
                        <button type="button" id="btnUlangiLatihan" class="btn-yellow flex-grow-1 flex-md-grow-0">
                            <i class="fa-solid fa-rotate-right"></i> Ulangi Latihan Baru
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Filter Pembahasan -->
        <section class="mb-3 d-flex flex-wrap justify-content-between align-items-center gap-2">
            <h2 class="h5 fw-bold mb-0"><i class="fa-solid fa-magnifying-glass-chart text-primary me-1"></i> Pembahasan Jawaban</h2>
            <div class="d-flex flex-wrap gap-1" id="reviewFilterGroup">
                <button type="button" class="btn btn-filter active" data-filter="all">Semua (50)</button>
                <button type="button" class="btn btn-filter" data-filter="benar" id="btnFilterBenar">Benar (0)</button>
                <button type="button" class="btn btn-filter" data-filter="salah" id="btnFilterSalah">Salah (0)</button>
            </div>
        </section>

        <!-- Daftar Review Soal -->
        <section id="reviewContainer"></section>
    </main>

    <footer class="text-center py-4 text-muted small">
        <div class="container">
            <p class="mb-0">Ringkasan &amp; Evaluasi ASAS PAIBP Kelas 3</p>
        </div>
    </footer>

    <script>
        const RESULT_KEY = 'asas_paibp_kls3_last_result_v1';
        const STORAGE_KEY = 'asas_paibp_kls3_session_v1';

        let resultData = null;

        function getPredikat(nilai) {
            if (nilai >= 90) return 'Sangat Baik (Mumtaz) 🌟';
            if (nilai >= 80) return 'Baik (Jayyid Jiddan) 👍';
            if (nilai >= 70) return 'Cukup Baik (Jayyid) 😊';
            return 'Perlu Belajar Lagi Semangat! 💪';
        }

        function renderResultPage() {
            const raw = localStorage.getItem(RESULT_KEY);
            if (!raw) {
                document.querySelector('main').innerHTML = `
                    <div class="score-card text-center py-5">
                        <i class="fa-solid fa-circle-exclamation text-warning fs-1 mb-3"></i>
                        <h4 class="fw-bold">Belum Ada Data Hasil Latihan</h4>
                        <p class="text-muted small mb-4">Silakan kerjakan latihan soal terlebih dahulu untuk melihat hasil evaluasi.</p>
                        <a href="soal.html" class="btn-yellow">
                            <i class="fa-solid fa-pen-to-square"></i> Mulai Mengerjakan Soal
                        </a>
                    </div>
                `;
                return;
            }

            resultData = JSON.parse(raw);

            // Identitas & Waktu
            document.getElementById('studentTitle').textContent = resultData.nama;
            const dateObj = new Date(resultData.submitted_at);
            const formattedDate = dateObj.toLocaleString('id-ID', {
                dateStyle: 'medium',
                timeStyle: 'short'
            });
            document.getElementById('studentSubtitle').textContent = `Kelas ${resultData.kelas} • Selesai pada ${formattedDate}`;

            // Skor
            document.getElementById('finalScore').textContent = resultData.nilai;
            document.getElementById('predikatText').textContent = getPredikat(resultData.nilai);
            document.getElementById('pgStat').textContent = `${resultData.pg_benar} / ${resultData.pg_total}`;
            document.getElementById('isianStat').textContent = `${resultData.isian_benar} / ${resultData.isian_total}`;
            document.getElementById('totalStat').textContent = `${resultData.total_benar} / ${resultData.total_soal}`;

            // Status Sinkronisasi Supabase
            const syncEl = document.getElementById('syncBadgeWrapper');
            if (resultData.sync_status === 'saved') {
                syncEl.innerHTML = `<span class="badge bg-success-subtle text-success border border-success-subtle rounded-pill px-3 py-1"><i class="fa-solid fa-cloud-check me-1"></i> Hasil berhasil tersimpan ke database</span>`;
            } else {
                syncEl.innerHTML = `<span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle rounded-pill px-3 py-1"><i class="fa-solid fa-database me-1"></i> Tersimpan di perangkat (${resultData.sync_status || 'lokal'})</span>`;
            }

            // Update tombol filter jumlah benar/salah
            const salahCount = resultData.total_soal - resultData.total_benar;
            document.getElementById('btnFilterBenar').textContent = `Benar (${resultData.total_benar})`;
            document.getElementById('btnFilterSalah').textContent = `Salah (${salahCount})`;

            renderReviewCards('all');
        }

        function renderReviewCards(filterType) {
            const container = document.getElementById('reviewContainer');
            container.innerHTML = '';

            const items = resultData.detail_jawaban.filter(item => {
                if (filterType === 'benar') return item.benar;
                if (filterType === 'salah') return !item.benar;
                return true;
            });

            if (items.length === 0) {
                container.innerHTML = `<div class="alert alert-info rounded-4 text-center small">Tidak ada soal pada kategori filter ini.</div>`;
                return;
            }

            items.forEach(item => {
                const card = document.createElement('div');
                card.className = 'review-card ' + (item.benar ? 'is-correct' : 'is-wrong');

                const statusBadge = item.benar
                    ? `<span class="badge bg-success rounded-pill px-3 py-2"><i class="fa-solid fa-check me-1"></i> Benar</span>`
                    : `<span class="badge bg-danger rounded-pill px-3 py-2"><i class="fa-solid fa-xmark me-1"></i> Salah</span>`;

                const tipeLabel = item.tipe === 'pg' ? 'Pilihan Ganda' : 'Jawaban Singkat';
                const userAnswerDisplay = item.jawaban_user && item.jawaban_user.trim() !== ''
                    ? item.jawaban_user
                    : '<em class="text-muted">(Tidak dijawab)</em>';

                let answerBlockHtml = '';
                if (item.benar) {
                    answerBlockHtml = `
                        <div class="ans-pill-correct small">
                            <i class="fa-solid fa-circle-check me-1"></i> Jawaban Anda: <span>${userAnswerDisplay}</span>
                        </div>
                    `;
                } else {
                    answerBlockHtml = `
                        <div class="row g-2 small">
                            <div class="col-12 col-md-6">
                                <div class="ans-pill-wrong h-100">
                                    <i class="fa-solid fa-circle-xmark me-1"></i> Jawaban Anda: <span>${userAnswerDisplay}</span>
                                </div>
                            </div>
                            <div class="col-12 col-md-6">
                                <div class="ans-pill-correct h-100">
                                    <i class="fa-solid fa-key me-1"></i> Kunci Jawaban: <span>${item.kunci_jawaban}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }

                card.innerHTML = `
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2 pb-2 border-bottom">
                        <div class="d-flex flex-wrap align-items-center gap-2">
                            <span class="badge bg-primary rounded-pill px-3 py-1">No. ${item.nomor_urut}</span>
                            <span class="badge bg-info-subtle text-primary rounded-pill px-2 py-1">${item.elemen}</span>
                            <span class="badge bg-light text-dark border rounded-pill px-2 py-1">${tipeLabel}</span>
                        </div>
                        ${statusBadge}
                    </div>
                    ${item.stimulus ? `<div class="stimulus-mini">${item.stimulus}</div>` : ''}
                    <div class="fw-bold mb-3">${item.pertanyaan}</div>
                    ${answerBlockHtml}
                    <div class="pembahasan-box">
                        <strong><i class="fa-solid fa-lightbulb text-warning me-1"></i> Pembahasan:</strong> ${item.pembahasan}
                    </div>
                `;

                container.appendChild(card);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderResultPage();

            document.querySelectorAll('#reviewFilterGroup .btn-filter').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#reviewFilterGroup .btn-filter').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    renderReviewCards(btn.getAttribute('data-filter'));
                });
            });

            document.getElementById('btnUlangiLatihan').addEventListener('click', () => {
                localStorage.removeItem(STORAGE_KEY);
                window.location.href = 'soal.html';
            });
        });
    </script>
</body>
</html>

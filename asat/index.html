<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian ASAT Kelas 3 - PAI</title>
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f0f4f8; /* Biru sangat muda / keabu-abuan */
        }
        .text-blue { color: #0d6efd; }
        .bg-blue { background-color: #0d6efd; color: white; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .btn-primary { background-color: #0d6efd; border: none; padding: 12px; font-weight: 600; border-radius: 8px;}
        .btn-primary:hover { background-color: #0b5ed7; }
        .video-grid iframe { width: 100%; height: 220px; border-radius: 10px; border: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
    </style>
</head>
<body class="py-5">

    <div class="container" style="max-width: 800px;">
        
        <!-- Form Pendaftaran -->
        <div class="card mb-4 border-top border-primary border-4">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <i class="fa-solid fa-graduation-cap fa-3x text-blue mb-3"></i>
                    <h2 class="fw-bold text-dark">Ujian PAI ASAT Kelas 3</h2>
                    <p class="text-muted">Silakan isi data diri Anda sebelum memulai ujian.</p>
                </div>
                
                <form id="startForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-dark"><i class="fa-solid fa-user me-2 text-blue"></i>Nama Lengkap</label>
                        <input type="text" class="form-control form-control-lg" id="nama" required placeholder="Masukkan nama lengkap Anda">
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-semibold text-dark"><i class="fa-solid fa-chalkboard-user me-2 text-blue"></i>Kelas</label>
                        <select class="form-select form-select-lg" id="kelas" required>
                            <option value="" disabled selected>Pilih Kelas...</option>
                            <option value="3A">Kelas 3A</option>
                            <option value="3B">Kelas 3B</option>
                            <option value="3C">Kelas 3C</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fa-solid fa-play me-2"></i>Mulai Ujian Sekarang
                    </button>
                </form>
            </div>
        </div>

        <!-- Galeri Video -->
        <div class="card border-top border-info border-4">
            <div class="card-body p-4">
                <h4 class="fw-bold text-dark mb-4"><i class="fa-solid fa-video me-2 text-info"></i>Materi Pembelajaran</h4>
                <div class="row g-4 video-grid">
                    <div class="col-md-6"><iframe src="https://www.youtube.com/embed/KzoWSOISZQ4" allowfullscreen></iframe></div>
                    <div class="col-md-6"><iframe src="https://www.youtube.com/embed/wBhhkkXr5sM" allowfullscreen></iframe></div>
                    <div class="col-md-6"><iframe src="https://www.youtube.com/embed/DqBB96Ic6XU" allowfullscreen></iframe></div>
                    <div class="col-md-6"><iframe src="https://www.youtube.com/embed/fGOgDkELdDg" allowfullscreen></iframe></div>
                    <div class="col-md-6"><iframe src="https://www.youtube.com/embed/rPQFcgbo6v4" allowfullscreen></iframe></div>
                </div>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('startForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const nama = document.getElementById('nama').value;
            const kelas = document.getElementById('kelas').value;
            
            localStorage.setItem('siswa_nama', nama);
            localStorage.setItem('siswa_kelas', kelas);
            localStorage.removeItem('jawaban_ujian'); // Reset jawaban
            
            window.location.href = 'soal.html';
        });
    </script>
</body>
</html>

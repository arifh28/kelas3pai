<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Asesmen</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f0f8ff; color: #334155; }
        .card { border: none; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        .score-circle {
            width: 150px; height: 150px;
            background: #e3f2fd;
            color: #0288d1;
            font-size: 48px;
            font-weight: 800;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
            margin: 20px auto;
            border: 8px solid #bbdefb;
        }
        .btn-wa { background-color: #25D366; color: white; font-weight: 600; border-radius: 12px; }
        .btn-wa:hover { background-color: #1ebe57; color: white; }
        .btn-reset { border-radius: 12px; font-weight: 600; }
        .info-badge { background: #e3f2fd; color: #0288d1; padding: 10px 20px; border-radius: 10px; font-weight: 600; }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row justify-content-center text-center">
        <div class="col-md-7">
            <div class="card p-5">
                <i class="fa-solid fa-circle-check text-success" style="font-size: 80px;"></i>
                <h2 class="fw-bold mt-3">Alhamdulillah, Selesai!</h2>
                
                <div class="d-flex justify-content-center gap-3 my-4">
                    <div class="info-badge">Nama: <span id="res-nama"></span></div>
                    <div class="info-badge">Kelas: <span id="res-kelas"></span></div>
                </div>

                <p class="text-muted mb-1">Skor Akhir Anda:</p>
                <div class="score-circle" id="res-score">0</div>
                
                <div class="row text-start mt-4 bg-light p-3 rounded-4">
                    <div class="col-6">
                        <small class="text-muted">Skor Pilgan:</small>
                        <h5 class="fw-bold" id="skor-pg">0</h5>
                    </div>
                    <div class="col-6">
                        <small class="text-muted">Skor Isian:</small>
                        <h5 class="fw-bold" id="skor-short">0</h5>
                    </div>
                </div>

                <div class="d-grid gap-2 mt-5">
                    <button class="btn btn-wa btn-lg d-flex align-items-center justify-content-center" onclick="kirimWA()">
                        <i class="fa-brands fa-whatsapp me-2 fa-lg"></i> Kirim Hasil ke WhatsApp
                    </button>
                    <button class="btn btn-outline-danger btn-reset mt-2" onclick="kerjakanLagi()">
                        <i class="fa-solid fa-rotate-right me-2"></i> Kerjakan Lagi dari Awal
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let finalScore = 0;
    let waText = "";
    
    window.onload = async () => {
        const nama = localStorage.getItem('nama_siswa');
        const kelas = localStorage.getItem('kelas_siswa');
        const answersStr = localStorage.getItem('jawabanUjian');
        
        if(!nama || !answersStr) {
            Swal.fire({
                icon: 'warning',
                title: 'Data Tidak Ditemukan',
                text: 'Anda belum mengerjakan ujian atau sesi telah berakhir.',
                confirmButtonColor: '#0288d1'
            }).then(() => {
                window.location.href = 'index.html';
            });
            return;
        }

        document.getElementById('res-nama').textContent = nama;
        document.getElementById('res-kelas').textContent = kelas;

        try {
            const response = await fetch('soal.json');
            const soalData = await response.json();
            const answers = JSON.parse(answersStr);

            // Koreksi Pilihan Ganda
            let benarPG = 0;
            soalData.pilihanGanda.forEach(q => {
                if(answers.pg && answers.pg[q.id] === q.jawaban) benarPG++;
            });

            // Koreksi Jawaban Singkat
            let benarShort = 0;
            let shortSummary = [];
            soalData.jawabanSingkat.forEach(q => {
                let ans = answers.short && answers.short[q.id] ? answers.short[q.id].trim() : '';
                let isCorrect = q.kunci.includes(ans.toLowerCase());
                if(isCorrect) benarShort++;
                shortSummary.push(`- ${ans} (${isCorrect ? 'Benar' : 'Salah'})`);
            });

            let skorPG = (benarPG / soalData.pilihanGanda.length) * 100;
            let skorShort = (benarShort / soalData.jawabanSingkat.length) * 100;
            finalScore = Math.round((skorPG + skorShort) / 2);

            document.getElementById('res-score').textContent = finalScore;
            document.getElementById('skor-pg').textContent = skorPG;
            document.getElementById('skor-short').textContent = skorShort;

            // Template Pesan WA
            waText = `*REKAP HASIL ASESMEN SALAT RAWATIB*%0A`;
            waText += `----------------------------%0A`;
            waText += `*Nama:* ${nama}%0A*Kelas:* ${kelas}%0A`;
            waText += `*SKOR AKHIR:* ${finalScore}/100%0A%0A`;
            waText += `*Detail:*%0A- Skor PG: ${skorPG}%0A- Skor Isian: ${skorShort}%0A%0A`;
            waText += `*Jawaban Isian:*%0A${shortSummary.join('%0A')}`;

        } catch (e) {
            Swal.fire({
                icon: 'error',
                title: 'Error Server',
                text: 'Gagal menghitung skor. Pastikan aplikasi berjalan di Local Server.',
                confirmButtonColor: '#0288d1'
            });
        }
    };

    function kirimWA() {
        const noWA = "6285161338173";
        window.open(`https://wa.me/${noWA}?text=${waText}`, '_blank');
    }

    function kerjakanLagi() {
        Swal.fire({
            title: 'Ulangi Ujian?',
            text: "Semua data jawaban dan nilai saat ini akan dihapus permanen.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#dc3545',
            cancelButtonColor: '#6c757d',
            confirmButtonText: 'Ya, Ulangi',
            cancelButtonText: 'Batal'
        }).then((result) => {
            if (result.isConfirmed) {
                localStorage.clear();
                window.location.href = 'index.html';
            }
        });
    }
</script>
</body>
</html>

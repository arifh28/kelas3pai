<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesmen Sumatif - Salat Rawatib</title>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #f0f8ff; 
            color: #334155;
        }
        .bg-light-blue { background-color: #e3f2fd; }
        .text-blue { color: #0288d1; }
        .card { 
            border: none; 
            border-radius: 16px; 
            box-shadow: 0 10px 25px rgba(0, 123, 255, 0.1); 
        }
        .btn-primary { 
            background-color: #0288d1; 
            border: none; 
            border-radius: 10px; 
            padding: 12px;
            font-weight: 600;
        }
        .btn-primary:hover { background-color: #0277bd; }
        .question-box {
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        .question-box:hover { border-color: #0288d1; }
        .form-check-input:checked { background-color: #0288d1; border-color: #0288d1; }
        .header-sticky {
            position: sticky;
            top: 10px;
            z-index: 1000;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <!-- Login Section -->
    <div id="login-section" class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 text-center">
                <div class="mb-3">
                    <i class="fa-solid fa-book-open text-blue" style="font-size: 64px;"></i>
                </div>
                <h3 class="fw-bold mb-1">Asesmen Sumatif Akhir</h3>
                <p class="text-muted mb-4">Materi: Salat Rawatib</p>
                
                <div class="text-start">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nama Lengkap</label>
                        <input type="text" id="nama" class="form-control form-control-lg" placeholder="Masukkan nama Anda">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Kelas</label>
                        <input type="text" id="kelas" class="form-control form-control-lg" placeholder="Contoh: 4A">
                    </div>
                    <button class="btn btn-primary w-100 btn-lg" onclick="mulaiUjian()">
                        Mulai Ujian Sekarang
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Quiz Section -->
    <div id="quiz-section" class="row justify-content-center hidden d-none">
        <div class="col-lg-8">
            <div class="card p-3 mb-4 header-sticky bg-light-blue border-0 shadow-sm">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <small class="text-muted d-block">Nama Siswa:</small>
                        <span id="display-nama" class="fw-bold text-blue"></span>
                    </div>
                    <div class="text-end">
                        <small class="text-muted d-block">Kelas:</small>
                        <span id="display-kelas" class="fw-bold text-blue"></span>
                    </div>
                </div>
            </div>

            <div id="soal-container"></div>
            
            <button class="btn btn-primary btn-lg w-100 mt-4 shadow" onclick="selesaiUjian()">
                <i class="fa-solid fa-paper-plane me-2"></i> Selesai & Kirim Jawaban
            </button>
        </div>
    </div>
</div>

<script>
    let soalData = null;

    window.onload = async () => {
        try {
            const response = await fetch('soal.json');
            soalData = await response.json();
        } catch (e) {
            Swal.fire({
                icon: 'error',
                title: 'Koneksi Gagal',
                text: 'Gagal mengambil data soal. Pastikan menggunakan Local Server.',
                confirmButtonColor: '#0288d1'
            });
            return;
        }

        const savedNama = localStorage.getItem('nama_siswa');
        const savedKelas = localStorage.getItem('kelas_siswa');
        const isStarted = localStorage.getItem('ujianStarted');

        if (savedNama && savedKelas && isStarted === 'true') {
            document.getElementById('nama').value = savedNama;
            document.getElementById('kelas').value = savedKelas;
            
            Swal.fire({
                title: 'Lanjutkan Ujian?',
                text: "Ditemukan sesi ujian sebelumnya yang belum selesai.",
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#0288d1',
                cancelButtonColor: '#6c757d',
                confirmButtonText: 'Ya, Lanjutkan',
                cancelButtonText: 'Mulai Ulang'
            }).then((result) => {
                if (result.isConfirmed) {
                    mulaiUjian(true);
                } else {
                    localStorage.clear();
                    document.getElementById('nama').value = '';
                    document.getElementById('kelas').value = '';
                }
            });
        }
    };

    function mulaiUjian(isResume = false) {
        const nama = document.getElementById('nama').value.trim();
        const kelas = document.getElementById('kelas').value.trim();

        if (!nama || !kelas) {
            Swal.fire({
                icon: 'warning',
                title: 'Data Belum Lengkap',
                text: 'Mohon lengkapi Nama dan Kelas terlebih dahulu!',
                confirmButtonColor: '#0288d1'
            });
            return;
        }

        localStorage.setItem('nama_siswa', nama);
        localStorage.setItem('kelas_siswa', kelas);
        localStorage.setItem('ujianStarted', 'true');

        document.getElementById('login-section').classList.add('d-none');
        document.getElementById('quiz-section').classList.remove('d-none');
        document.getElementById('display-nama').textContent = nama;
        document.getElementById('display-kelas').textContent = kelas;

        renderSoal();
        if (isResume) restoreAnswers();
    }

    function renderSoal() {
        const container = document.getElementById('soal-container');
        let html = `<h4 class="fw-bold mb-4 d-flex align-items-center">
            <i class="fa-solid fa-list-check text-blue me-2"></i> Bagian A: Pilihan Ganda
        </h4>`;

        soalData.pilihanGanda.forEach((q, index) => {
            html += `<div class="question-box shadow-sm">
                <p class="fw-bold mb-3">${index + 1}. ${q.soal}</p>`;
            for (const [key, value] of Object.entries(q.opsi)) {
                html += `
                <div class="form-check mb-2">
                    <input class="form-check-input" type="radio" name="pg_${q.id}" id="pg_${q.id}_${key}" value="${key}" onchange="saveProgress()">
                    <label class="form-check-label" for="pg_${q.id}_${key}"><b>${key}.</b> ${value}</label>
                </div>`;
            }
            html += `</div>`;
        });

        html += `<h4 class="fw-bold mb-4 mt-5 d-flex align-items-center">
            <i class="fa-solid fa-pen-to-square text-blue me-2"></i> Bagian B: Jawaban Singkat
        </h4>`;
        
        soalData.jawabanSingkat.forEach((q, index) => {
            html += `<div class="question-box shadow-sm">
                <p class="fw-bold mb-3">${index + 1}. ${q.soal}</p>
                <input type="text" class="form-control" name="short_${q.id}" oninput="saveProgress()" placeholder="Ketik jawaban Anda...">
            </div>`;
        });

        container.innerHTML = html;
    }

    function saveProgress() {
        const answers = { pg: {}, short: {} };
        soalData.pilihanGanda.forEach(q => {
            const checked = document.querySelector(`input[name="pg_${q.id}"]:checked`);
            if (checked) answers.pg[q.id] = checked.value;
        });
        soalData.jawabanSingkat.forEach(q => {
            const text = document.querySelector(`input[name="short_${q.id}"]`);
            if (text) answers.short[q.id] = text.value;
        });
        localStorage.setItem('jawabanUjian', JSON.stringify(answers));
    }

    function restoreAnswers() {
        const saved = localStorage.getItem('jawabanUjian');
        if (saved) {
            const answers = JSON.parse(saved);
            for (const [id, val] of Object.entries(answers.pg || {})) {
                const r = document.querySelector(`input[name="pg_${id}"][value="${val}"]`);
                if(r) r.checked = true;
            }
            for (const [id, val] of Object.entries(answers.short || {})) {
                const t = document.querySelector(`input[name="short_${id}"]`);
                if(t) t.value = val;
            }
        }
    }

    function selesaiUjian() {
        Swal.fire({
            title: 'Kirim Semua Jawaban?',
            text: "Pastikan Anda sudah mengecek ulang jawaban.",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#0288d1',
            cancelButtonColor: '#dc3545',
            confirmButtonText: 'Ya, Kirim!',
            cancelButtonText: 'Batal'
        }).then((result) => {
            if (result.isConfirmed) {
                saveProgress();
                window.location.href = 'hasil.html';
            }
        });
    }
</script>
</body>
</html>
